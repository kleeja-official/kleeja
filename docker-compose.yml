services:
  kleeja:
    build:
      context: ./
      args:
        UID: ${UID:-1000}
        GID: ${GID:-1000}
    ports:
      - 8080:80
    volumes:
      - ./:/var/www/html
    depends_on:
      - mysql
    networks:
      - kleeja-network

  mysql:
    image: mysql:8.0
    restart: always
    ports:
      - "127.0.0.1:3306:3306"
    environment:
      MYSQL_ROOT_PASSWORD: rootpass
      MYSQL_DATABASE: appdb
      MYSQL_USER: appuser
      MYSQL_PASSWORD: apppass
    volumes:
      - mysql_data:/var/lib/mysql
    networks:
      - kleeja-network

  mailpit:
    image: axllent/mailpit:latest
    ports:
      - "8025:8025"
      - "1025:1025"
    environment:
      MP_WEBROOT: mailpit
      MP_SMTP_AUTH_ACCEPT_ANY: 1
      MP_SMTP_AUTH_ALLOW_INSECURE: 1
    networks:
      - kleeja-network

volumes:
  mysql_data:

networks:
  kleeja-network:
    driver: bridge
