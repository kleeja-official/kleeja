<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex, nofollow">
    <title>403 - Access forbidden! · Powered by Kleeja</title>
    <style>
        :root {
            --kj-coral: #F45B69;
            --kj-coral-600: #C84B56;
            --kj-coral-100: #FEEBED;
            --kj-coral-800: #7F2F37;
            --kj-navy: #0B1F3A;
            --kj-navy-50: #F6F7F8;
            --kj-navy-200: #D9DCE0;
            --kj-navy-600: #546275;

            --kj-bg: var(--kj-navy-50);
            --kj-surface: #FFFFFF;
            --kj-border: var(--kj-navy-200);
            --kj-text: var(--kj-navy);
            --kj-muted: var(--kj-navy-600);
            --kj-link: var(--kj-coral-600);
            --kj-badge-bg: var(--kj-coral-100);
            --kj-badge-text: var(--kj-coral-800);
        }

        @media (prefers-color-scheme: dark) {
            :root {
                --kj-bg: var(--kj-navy);
                --kj-surface: #23354E;
                --kj-border: #3C4C61;
                --kj-text: #FFFFFF;
                --kj-muted: #BBC0C8;
                --kj-link: var(--kj-coral);
                --kj-badge-bg: #582126;
                --kj-badge-text: #FCD4D8;
            }
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background: var(--kj-bg);
            color: var(--kj-text);
            font-family: "Inter", "IBM Plex Sans Arabic", system-ui, -apple-system, "Segoe UI", sans-serif;
            line-height: 1.5;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 48px 16px;
        }

        .kj-card {
            width: 100%;
            max-width: 560px;
            background: var(--kj-surface);
            border: 1px solid var(--kj-border);
            border-top: 4px solid var(--kj-coral);
            border-radius: 8px;
            box-shadow: 0 8px 24px rgba(11, 31, 58, .12);
            padding: 32px;
        }

        .kj-header {
            display: flex;
            align-items: center;
            gap: 16px;
            margin-bottom: 24px;
        }

        .kj-header img {
            display: block;
        }

        .kj-code {
            font-size: 48px;
            font-weight: 700;
            line-height: 1;
            letter-spacing: -.02em;
            color: var(--kj-coral);
        }

        h1 {
            font-size: 20px;
            font-weight: 700;
            margin-bottom: 4px;
        }

        .kj-badge {
            display: inline-block;
            background: var(--kj-badge-bg);
            color: var(--kj-badge-text);
            font-size: 12px;
            font-weight: 600;
            padding: 2px 10px;
            border-radius: 999px;
        }

        .kj-muted {
            color: var(--kj-muted);
        }

        .kj-footer {
            margin-top: 24px;
            padding-top: 16px;
            border-top: 1px solid var(--kj-border);
            font-size: 14px;
        }

        .kj-link {
            color: var(--kj-link);
            text-decoration: none;
            text-underline-offset: 2px;
        }

        .kj-link:hover,
        .kj-link:focus-visible {
            text-decoration: underline;
        }

        @media (max-width: 480px) {
            .kj-card {
                padding: 24px;
            }
        }
    </style>
</head>
<body title="&#1603;&#1604;&#1610;&#1580;&#1575;">
    <main class="kj-card">
        <div class="kj-header">
            <picture>
                <source srcset="https://kleeja.net/images/logo-light.svg" media="(prefers-color-scheme: dark)">
                <img src="https://kleeja.net/images/logo.svg" alt="Kleeja" width="48" height="48">
            </picture>
            <div>
                <h1>Access forbidden!</h1>
                <span class="kj-badge">HTTP 403 · Forbidden</span>
            </div>
        </div>

        <p class="kj-code">403</p>
        <p class="kj-muted" style="margin-top: 12px;">
            You don't have permission to browse this directory.
        </p>

        <div class="kj-footer">
            <a class="kj-link" href="https://kleeja.net" target="_blank" rel="noopener">Powered by Kleeja</a>
        </div>
    </main>
</body>
</html>
